<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Architectural Design - smART Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/animations.css">
    <style>
        :root {
            --pkg-blue: #0E3B66;
            --pkg-gold: #C09553;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; overflow: hidden; background: #000; padding-top: 0 !important; }

        /* --- 1. HEADER --- */
        .header-wrapper {
            position: absolute; top: 0; left: 0; right: 0; width: 100%;
            padding: 14px 2% 6px 2%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            grid-template-rows: auto auto;
            grid-template-areas: 'logo-l line logo-r' '. nav .';
            align-items: center;
            column-gap: 16px;
            z-index: 1000; background: transparent !important;
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            font-family: 'Inter', sans-serif;
        }
        .logo-left { grid-area: logo-l; background: none !important; }
        .logo-left img { height: 30px; display: block; filter: drop-shadow(0px 1px 5px rgba(255,255,255,0.35)); }
        .header-line-wrap { grid-area: line; height: 1px; background: rgba(255,255,255,0.9); }
        .logo-right { grid-area: logo-r; display: flex; align-items: center; background: none !important; }
        .header-nav { grid-area: nav; display: flex; justify-content: flex-end; gap: 2px; align-items: center; padding: 3px 0 0; background: none !important; }
        .nav-link {
            color: white; text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 15px; font-weight: 400;
            padding: 4px 10px; border-radius: 4px; white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.45); transition: background 0.2s;
        }
        .nav-link:hover { opacity: 0.7; }

        /* --- 2. SPLIT LAYOUT --- */
        .architecture-container { display: flex; width: 100%; height: 100vh; }

        .design-column {
            flex: 1; position: relative; overflow: hidden;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer; border-right: 1px solid rgba(255,255,255,0.05);
            text-decoration: none;
            z-index: 5;
        }

        .column-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            transition: transform 1.2s ease; z-index: 1;
        }
        
        .design-column::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(14, 59, 102, 0.7));
            z-index: 2; transition: 0.5s;
        }

        .design-column:hover { flex: 1.8; }
        .design-column:hover .column-bg { transform: scale(1.05); }
        .design-column:hover::after { background: rgba(14, 59, 102, 0.2); }

        /* Trạng thái mở rộng khi click chuyển cảnh */
        .design-column.expanded {
            position: fixed;
            top: 0; left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 10000;
            flex: none;
        }

        /* --- 3. TEXT CỘT BÊN DƯỚI --- */
        .column-content {
            position: absolute; bottom: 80px; left: 40px; right: 40px;
            z-index: 10; color: #fff; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        /* Column labels — same treatment as passive-interventions' .hero-label:
           regular weight, tight tracking, blue offset shadow */
        .column-content h2 {
            font-size: clamp(16px, 2.13vw, 40px); font-weight: 400;
            line-height: 1.45; text-transform: uppercase; letter-spacing: -0.2px;
            text-shadow: 0 -2px 0 #1d6bb6;
        }

        /* HERO TITLE — landscape-page treatment: upper-right, right-aligned */
        .hero-container {
            position: absolute;
            top: 14.4%;
            right: 6%;
            left: auto;
            transform: none;
            z-index: 20;
            text-align: right;
            pointer-events: none;
            width: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            transition: opacity 0.5s ease;
        }
        /* ARCHITECTURAL DESIGN — original Figma style (uniform 63px) */
        .top-content h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 63px);
            font-family: 'Inter', sans-serif;
            font-weight: 600; color: #fff;
            line-height: 1.45;
            text-transform: uppercase; word-wrap: break-word;
            text-shadow: -3px 1px 0px rgba(83, 104, 169, 1.00);
        }

        .newsletter-btn {
            display: inline-block; margin-top: 25px;
            padding: 12px 35px; border-radius: 50px; background: #fff;
            color: var(--pkg-blue); font-weight: 700; font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); pointer-events: auto;
            text-decoration: none; transition: 0.4s;
        }
        .newsletter-btn:hover { background: var(--pkg-gold); color: #fff; transform: translateY(-5px); }

        /* Hiệu ứng ẩn khi đang load chuyển cảnh */
        body.is-switching .header-wrapper, 
        body.is-switching .hero-container,
        body.is-switching .column-content {
            opacity: 0;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            /* Stack the three door-columns vertically; each stays tappable */
            .architecture-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .design-column {
                min-height: 33vh;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
            .design-column:hover { flex: 1; } /* hover-grow is a desktop affordance */
            .column-content { bottom: 24px; left: 20px; right: 20px; }
            /* Center the title over the stacked doors; reset the desktop
               upper-right anchoring so it can't overflow the viewport */
            .hero-container {
                top: 16% !important; right: auto !important; left: 0 !important;
                width: 100% !important; align-items: flex-start !important;
                text-align: left !important; padding: 0 20px !important;
                box-sizing: border-box;
            }
            .top-content { width: 100% !important; max-width: 100% !important; }
            .top-content h1 { width: 100% !important; max-width: 100% !important; margin: 0; font-size: clamp(24px, 8vw, 40px) !important; }
            .newsletter-btn { font-size: 12px !important; padding: 10px 24px !important; }
        }
    </style>
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <style>
    @media (max-width: 768px) {
        html, body { overflow-x: hidden !important; max-width: 100% !important; }
        .header-wrapper { position: relative !important; background: #2f4149 !important; padding: 12px 5% !important; z-index: 2000; }
        .header-line-wrap { background: rgba(255,255,255,0.4) !important; }
    }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <div class="logo-left"><a href="../../index.html"><img src="../../assets/images/Logo_SHLL_long.webp" alt="SHL Logo"></a></div>
        <div class="header-line-wrap"></div>
        <div class="logo-right"><a href="../../index.html"><img src="../../assets/images/index/logo/logo1.webp" alt="UEH" style="height:30px;width:auto;display:block;filter:drop-shadow(0px 1px 5px rgba(255,255,255,0.35));"></a></div>
        <nav class="header-nav"><a href="../../index.html" class="nav-link">Home</a><a href="index.html" class="nav-link">Back</a><a href="../../pages/about.html" class="nav-link">About SHLL</a></nav>
    </div>

    <section class="hero-container">
        <div class="top-content" data-aos="fade-left">
            <h1>ARCHITECTURAL<br>DESIGN</h1>
        </div>
        <a href="#" class="newsletter-btn">Sent Us Your Newsletter</a>
    </section>

    <main class="architecture-container">
        
        <a href="architectural-layout.html" class="design-column" onclick="transitionPage(event, this)">
            <div class="column-bg" style="background-image: url('../../assets/images/package2/Architecture/bia1.webp');"></div>
            <div class="column-content">
                <h2>ARCHITECTURAL<br>LAYOUT DESIGN</h2>
            </div>
        </a>

        <a href="passive-interventions.html" class="design-column" onclick="transitionPage(event, this)">
            <div class="column-bg" style="background-image: url('../../assets/images/package2/Architecture/bia2.webp');"></div>
            <div class="column-content">
                <h2>PASSIVE<br>INTERVENTIONS</h2>
            </div>
        </a>

        <a href="spatial-assessment.html" class="design-column" onclick="transitionPage(event, this)">
            <div class="column-bg" style="background-image: url('../../assets/images/package2/Architecture/bia3.webp');"></div>
            <div class="column-content">
                <h2>BEFORE - AFTER<br>SPATIAL ASSESSMENT</h2>
            </div>
        </a>

    </main>

    <script>
        function transitionPage(e, element) {
            e.preventDefault();
            const targetUrl = element.getAttribute('href');
            
            document.body.classList.add('is-switching');
            element.classList.add('expanded');

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        }
    </script>

<script src="../../assets/js/animations.js"></script>
</body>
</html>
